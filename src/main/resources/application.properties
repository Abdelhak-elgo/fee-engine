spring.application.name=fee-engine
server.port=8186

# Datasource (dev — see docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5433/fees
spring.datasource.username=fees
spring.datasource.password=fees

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration