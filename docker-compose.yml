name: fee-engine

services:
  postgres:
    image: postgres:16.2
    container_name: fee-engine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fees
      POSTGRES_USER: fees
      POSTGRES_PASSWORD: fees
    ports:
      - "5433:5432"
    volumes:
      - fee-engine-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fees -d fees"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fee-engine-postgres-data:
